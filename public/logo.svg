<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 背景暗色深邃渐变 -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>

    <!-- 骨架与羽翼的主金紫渐变 -->
    <linearGradient id="goldPurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="45%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- 核心解构星芒发光渐变 -->
    <linearGradient id="coreSparkGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- 发光滤镜 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 圆角背景底座 -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="#27272a" stroke-width="2"/>

  <!-- 内部几何发光微光线 -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#f59e0b" stroke-opacity="0.08" stroke-width="1.5" stroke-dasharray="6 6"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="#8b5cf6" stroke-opacity="0.05" stroke-width="1"/>

  <!-- 象征“故事骨架与折纸羽毛笔”的核心几何折叠形态 -->
  <g transform="translate(256, 256) rotate(-22) translate(-256, -256)" filter="url(#glow)">
    <!-- 左翼多边形：深金色 -->
    <path d="M 256,96 L 160,256 L 256,220 Z" fill="#b45309" opacity="0.9"/>
    <!-- 右翼多边形：亮金色 -->
    <path d="M 256,96 L 352,256 L 256,220 Z" fill="#f59e0b"/>

    <!-- 羽身中段解构面：紫罗兰渐变 -->
    <path d="M 160,256 L 256,220 L 256,360 L 190,380 Z" fill="#6d28d9" opacity="0.85"/>
    <path d="M 352,256 L 256,220 L 256,360 L 322,380 Z" fill="#8b5cf6" opacity="0.95"/>

    <!-- 笔尖与灵感核心：锋利交错 -->
    <path d="M 256,360 L 190,380 L 256,436 Z" fill="#4c1d95"/>
    <path d="M 256,360 L 322,380 L 256,436 Z" fill="#7c3aed"/>
    <polygon points="256,416 251,436 256,442 261,436" fill="#fbbf24"/>

    <!-- 中缝骨架透光线 -->
    <line x1="256" y1="96" x2="256" y2="436" stroke="#fef08a" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- 象征“灵感与逆向破局”的四芒星 -->
  <g transform="translate(350, 130)">
    <path d="M 0,-24 Q 0,0 24,0 Q 0,0 0,24 Q 0,0 -24,0 Q 0,0 0,-24 Z" fill="url(#coreSparkGrad)"/>
    <circle cx="0" cy="0" r="3" fill="#ffffff"/>
  </g>

  <!-- 伴随微星 -->
  <g transform="translate(135, 340)">
    <path d="M 0,-14 Q 0,0 14,0 Q 0,0 0,14 Q 0,0 -14,0 Q 0,0 0,-14 Z" fill="#f59e0b" opacity="0.8"/>
  </g>
</svg>
